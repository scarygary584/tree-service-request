<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Hot Springs storm-damaged tree safety guide</title>
  <desc id="desc">A five-step decision guide: check for power lines and immediate danger, keep people away, do not climb or cut, document from a safe location, and contact qualified help.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143f2d"/>
      <stop offset="1" stop-color="#14613c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183126" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55a85f"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#fffdf8"/>
  <rect width="1200" height="260" fill="url(#header)"/>
  <circle cx="1040" cy="92" r="150" fill="#55a85f" opacity=".16"/>
  <circle cx="1120" cy="210" r="110" fill="#ffffff" opacity=".07"/>
  <path d="M86 194 C118 113 188 84 250 112 C224 190 160 225 86 194 Z" fill="#79c36a"/>
  <path d="M102 190 C148 170 190 146 232 119" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="86" fill="#d8f0de" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">HOT SPRINGS, ARKANSAS</text>
  <text x="300" y="143" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Storm-Damaged Tree</text>
  <text x="300" y="202" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Safety Guide</text>
  <text x="80" y="320" fill="#25312d" font-family="Arial, sans-serif" font-size="28" font-weight="700">Start with danger—not cleanup.</text>
  <text x="80" y="360" fill="#65716c" font-family="Arial, sans-serif" font-size="22">Do not climb, cut, pull, or move storm debris just to inspect it.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="410" width="1040" height="170" rx="18" fill="#fff" stroke="#d8ded4" stroke-width="2"/>
    <circle cx="165" cy="495" r="48" fill="#b85032"/>
    <text x="165" y="508" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">1</text>
    <text x="245" y="464" fill="#25312d" font-family="Arial, sans-serif" font-size="30" font-weight="800">Power line, fire, injury, or immediate danger?</text>
    <text x="245" y="510" fill="#3d4843" font-family="Arial, sans-serif" font-size="23">Stay away. Assume every downed line is energized.</text>
    <text x="245" y="548" fill="#b85032" font-family="Arial, sans-serif" font-size="23" font-weight="700">Call 911 for immediate danger. Report Entergy lines: 1-800-968-8243.</text>
  </g>
  <path d="M600 580 L600 625" stroke="#55a85f" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="640" width="1040" height="145" rx="18" fill="#fff" stroke="#d8ded4" stroke-width="2"/>
    <circle cx="165" cy="713" r="48" fill="#14613c"/>
    <text x="165" y="726" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">2</text>
    <text x="245" y="694" fill="#25312d" font-family="Arial, sans-serif" font-size="30" font-weight="800">Keep everyone outside the possible fall area</text>
    <text x="245" y="738" fill="#3d4843" font-family="Arial, sans-serif" font-size="23">Avoid hanging limbs, split trunks, uprooted roots, and unstable debris.</text>
  </g>
  <path d="M600 785 L600 830" stroke="#55a85f" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="845" width="1040" height="145" rx="18" fill="#fff" stroke="#d8ded4" stroke-width="2"/>
    <circle cx="165" cy="918" r="48" fill="#14613c"/>
    <text x="165" y="931" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">3</text>
    <text x="245" y="899" fill="#25312d" font-family="Arial, sans-serif" font-size="30" font-weight="800">Do not climb, cut, pull, or attach a vehicle</text>
    <text x="245" y="943" fill="#3d4843" font-family="Arial, sans-serif" font-size="23">Damaged wood can be suspended, unstable, or under hidden tension.</text>
  </g>
  <path d="M600 990 L600 1035" stroke="#55a85f" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="1050" width="1040" height="145" rx="18" fill="#fff" stroke="#d8ded4" stroke-width="2"/>
    <circle cx="165" cy="1123" r="48" fill="#14613c"/>
    <text x="165" y="1136" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">4</text>
    <text x="245" y="1104" fill="#25312d" font-family="Arial, sans-serif" font-size="30" font-weight="800">Document only from a safe location</text>
    <text x="245" y="1148" fill="#3d4843" font-family="Arial, sans-serif" font-size="23">Note structures, access, nearby lines, and visible damage. Contact insurance.</text>
  </g>
  <path d="M600 1195 L600 1240" stroke="#55a85f" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="1255" width="1040" height="145" rx="18" fill="#e8f2e4" stroke="#55a85f" stroke-width="3"/>
    <circle cx="165" cy="1328" r="48" fill="#14613c"/>
    <text x="165" y="1341" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">5</text>
    <text x="245" y="1309" fill="#25312d" font-family="Arial, sans-serif" font-size="30" font-weight="800">Use qualified help for serious damage</text>
    <text x="245" y="1353" fill="#3d4843" font-family="Arial, sans-serif" font-size="23">Confirm qualifications, insurance, scope, cleanup, price, and timing.</text>
  </g>

  <text x="80" y="1452" fill="#14613c" font-family="Arial, sans-serif" font-size="22" font-weight="800">TreeServiceRequest.com</text>
  <text x="1118" y="1452" text-anchor="end" fill="#65716c" font-family="Arial, sans-serif" font-size="18">Safety summary—not an inspection or emergency service</text>
</svg>
